<!doctype html>
<html lang="zh-CN" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="纯单机数独，没有账号、没有网络请求，对局与统计都留在本机。" />
    <meta name="theme-color" content="#06080f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="数独" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>数独</title>
    <script>
      // 首帧前定主题，避免系统浅色时闪一下夜色。
      (function () {
        var theme = 'night';
        try {
          var raw = localStorage.getItem('sudoku:settings:v1');
          var saved = raw ? JSON.parse(raw) : null;
          var pref = saved && (saved.theme === 'night' || saved.theme === 'day') ? saved.theme : null;
          if (pref) theme = pref;
          else theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'day' ? '#f4f6f9' : '#06080f');
      })();
    </script>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>数独需要开启 JavaScript 才能游玩。</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
